name: Build & Test Debug

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ main, master, staging, stable ] # Prospect: add main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # Prospect: skip the build when Stomper already ran it locally
  stomper:
    uses: ./.github/workflows/ps-stomper.yml
  # Prospect: End

  build:
    needs: stomper # Prospect
    if: github.actor != 'ProspectBot' && github.event.pull_request.draft == false && needs.stomper.outputs.skip != 'true' # Prospect: PJBot<ProspectBot, Stomper
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - name: Checkout Master
      uses: actions/checkout@v7

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Run Content.Tests
      shell: pwsh
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Run Content.IntegrationTests
      shell: pwsh
      run: |
        $env:DOTNET_gcServer=1
        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Archive NUnit3 test results.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-${{ matrix.os }}
        path: test_results/*
        retention-days: 7
        compression-level: 9
  ci-success:
    name: Build & Test Debug
    needs:
      - stomper # Prospect
      - build
    # Prospect: also pass when Stomper skipped the build
    if: always() && !cancelled() && github.actor != 'ProspectBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        env:
          BUILD: ${{ needs.build.result }}
          STOMPED: ${{ needs.stomper.outputs.skip }}
        run: |
          if [ "$BUILD" = "success" ]; then exit 0; fi
          if [ "$BUILD" = "skipped" ] && [ "$STOMPED" = "true" ]; then
            echo "Build skipped: Stomper stamp is valid."
            exit 0
          fi
          echo "Build result: $BUILD"
          exit 1
    # Prospect: End
