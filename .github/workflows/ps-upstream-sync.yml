name: "PS: Upstream Sync"

# Manually triggered sync with upstream space-wizards/space-station-14.
# It merges the upstream branch into a new sync branch and opens a draft PR.
# If the merge conflicts, the conflict markers are committed as-is so an AI
# assistant (see AGENTS.md) can resolve them inside the pull request.

on:
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "Upstream branch to sync from"
        required: true
        default: "stable"
        type: string
      base_branch:
        description: "Branch of this repository to merge upstream into"
        required: true
        default: "develop"
        type: string
      draft:
        description: "Open the pull request as a draft"
        required: false
        default: true
        type: boolean

concurrency:
  group: ps-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/space-wizards/space-station-14.git
  UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
  BASE_BRANCH: ${{ inputs.base_branch }}

jobs:
  sync:
    name: Merge upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          submodules: false

      - name: Setup Git
        run: |
          git config --global user.name "${{ vars.CHANGELOG_USER || 'github-actions[bot]' }}"
          git config --global user.email "${{ vars.CHANGELOG_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}"
        shell: bash

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
        shell: bash

      - name: Create sync branch
        id: branch
        run: |
          BRANCH="task/upstream-sync-$(date -u +'%Y-%m-%d-%H%M%S')"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse --short upstream/$UPSTREAM_BRANCH)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Merge upstream
        id: merge
        run: |
          set +e
          # Large upstream merges exceed git's default rename limit. Without rename
          # detection, a file Prospect moved looks deleted, and the upstream change to it
          # would be dropped by the "keep our deletion" rule below.
          git -c merge.renameLimit=999999 -c diff.renameLimit=999999 \
            merge --no-ff --no-commit "upstream/$UPSTREAM_BRANCH"
          MERGE_STATUS=$?
          set -e

          if [ "$MERGE_STATUS" -eq 0 ] && git diff --cached --quiet && [ ! -f .git/MERGE_HEAD ]; then
            echo "Already up to date with upstream/$UPSTREAM_BRANCH."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          CONFLICTS=$(git diff --name-only --diff-filter=U || true)
          if [ -n "$CONFLICTS" ]; then
            # - Files Prospect deleted and upstream modified (stages 1 and 3, no
            #   stage 2): keep our deletion. Stage-3-only paths (for example an
            #   upstream file added in a folder Prospect renamed) are NOT deletions.
            # - Submodule conflicts: submodules are not checked out, so `git add`
            #   cannot stage them. Stage the upstream commit provisionally
            #   (Prospect follows the upstream engine) and list it for review.
            # - Other conflicts without text markers (binary, deleted upstream,
            #   stage-3-only) are listed in the PR so they get resolved by hand.
            UNMARKED=""
            KEPT=""
            while IFS= read -r FILE; do
              STAGES=$(git ls-files -u -- "$FILE")
              has_stage() { printf '%s\n' "$STAGES" | awk -v s="$1" '$3 == s { found = 1 } END { exit !found }'; }
              stage_sha() { printf '%s\n' "$STAGES" | awk -v s="$1" '$3 == s { print $2; exit }'; }

              if printf '%s\n' "$STAGES" | grep -q '^160000 '; then
                SHA=$(stage_sha 3)
                SIDE="upstream"
                if [ -z "$SHA" ]; then
                  SHA=$(stage_sha 2)
                  SIDE="Prospect"
                fi
                git update-index --cacheinfo "160000,$SHA,$FILE"
                UNMARKED+="- \`$FILE\` (submodule: $SIDE commit \`${SHA:0:10}\` staged provisionally)"$'\n'
              elif has_stage 1 && has_stage 3 && ! has_stage 2; then
                git rm -q -f -- "$FILE"
                echo "Kept Prospect deletion of $FILE"
                KEPT+="$FILE"$'\n'
                CONFLICTS=$(printf '%s\n' "$CONFLICTS" | grep -vxF -- "$FILE" || true)
              elif [ ! -f "$FILE" ] || ! grep -q '^<<<<<<< ' "$FILE"; then
                UNMARKED+="- \`$FILE\`"$'\n'
              fi
            done <<< "$CONFLICTS"

            echo "unmarked<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s' "$UNMARKED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"

            echo "kept_deletions<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s' "$KEPT" | sed 's|^|- `|;s|$|`|' >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$CONFLICTS" ]; then
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            {
              echo "conflict_list<<EOF"
              echo "$CONFLICTS" | sed 's|^|- `|;s|$|`|'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            echo "conflict_list=" >> "$GITHUB_OUTPUT"
          fi

          # Commit whatever came out of the merge, including conflict markers,
          # so the resolution can happen in the pull request.
          git add -A
          git commit --no-verify -m "Merge upstream/$UPSTREAM_BRANCH into $BASE_BRANCH" \
            -m "Upstream: $UPSTREAM_REPO ($UPSTREAM_BRANCH @ $(git rev-parse --short upstream/$UPSTREAM_BRANCH))"
        shell: bash

      - name: Push sync branch
        if: steps.merge.outputs.changed == 'true'
        run: git push origin "${{ steps.branch.outputs.name }}"
        shell: bash

      - name: Open pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          CONFLICT_LIST: ${{ steps.merge.outputs.conflict_list }}
          UNMARKED_LIST: ${{ steps.merge.outputs.unmarked }}
          KEPT_LIST: ${{ steps.merge.outputs.kept_deletions }}
          UPSTREAM_SHA: ${{ steps.branch.outputs.upstream_sha }}
          DRAFT: ${{ inputs.draft }}
        run: |
          BODY_FILE="$(mktemp)"
          {
            echo "Automated merge of \`space-wizards/space-station-14@$UPSTREAM_BRANCH\` (\`$UPSTREAM_SHA\`) into \`$BASE_BRANCH\`."
            echo
            if [ "$CONFLICTS" = "true" ]; then
              echo "## :warning: Conflicts need resolving"
              echo
              echo "The merge commit on this branch contains **unresolved conflict markers**."
              echo "Resolve them following the conventions in \`AGENTS.md\`:"
              echo
              echo "- Keep all Prospect changes (\`_PS\` folders and \`# Prospect\` / \`// Prospect\` marked blocks)."
              echo "- Take upstream changes for everything else, re-applying Prospect markers where needed."
              echo "- Make sure no \`<<<<<<<\`, \`=======\` or \`>>>>>>>\` markers remain."
              echo
              echo "### Conflicted files"
              echo
              echo "$CONFLICT_LIST"
              if [ -n "$UNMARKED_LIST" ]; then
                echo
                echo "### Conflicts without text markers"
                echo
                echo "These have no \`<<<<<<<\` markers (binary, submodule, deleted upstream, or an upstream file in a folder Prospect renamed). Pick the correct side explicitly:"
                echo
                echo "$UNMARKED_LIST"
              fi
            elif [ -n "$KEPT_LIST" ]; then
              echo "The merge has no text conflicts, but some upstream changes were dropped. Review the list below."
            else
              echo "The merge applied cleanly, no conflicts to resolve."
            fi
            if [ -n "$KEPT_LIST" ]; then
              echo
              echo "### Prospect deletions kept (upstream changes dropped)"
              echo
              echo "Upstream changed these files, but Prospect deleted them, so the deletion was kept and the upstream change was dropped."
              echo "If Prospect moved a file instead of deleting it, port the upstream change to the new path."
              echo
              echo "$KEPT_LIST"
            fi
            echo
            echo "### Checklist"
            echo
            echo "- [ ] Conflict markers resolved"
            if [ -n "$UNMARKED_LIST" ]; then
              echo "- [ ] Conflicts without text markers resolved"
            fi
            if [ -n "$KEPT_LIST" ]; then
              echo "- [ ] Kept deletions reviewed"
            fi
            echo "- [ ] \`dotnet build\` succeeds"
            echo "- [ ] YAML linter passes"
          } > "$BODY_FILE"

          DRAFT_FLAG=""
          if [ "$DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "Merge upstream $UPSTREAM_BRANCH into $BASE_BRANCH ($UPSTREAM_SHA)" \
            --body-file "$BODY_FILE" \
            $DRAFT_FLAG

          if [ "$CONFLICTS" = "true" ]; then
            gh pr comment "$BRANCH" --body "@copilot Please resolve all merge conflicts in this pull request following the conventions in \`AGENTS.md\` and the instructions in the description: keep Prospect changes, take upstream otherwise, and leave no conflict markers. Then make sure the build and YAML linter pass."
          fi
        shell: bash

      - name: Summary
        run: |
          if [ "${{ steps.merge.outputs.changed }}" != "true" ]; then
            echo "Nothing to sync: $BASE_BRANCH is already up to date with upstream/$UPSTREAM_BRANCH." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.merge.outputs.conflicts }}" = "true" ]; then
            echo "Sync branch \`${{ steps.branch.outputs.name }}\` pushed with **conflicts** to resolve." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sync branch \`${{ steps.branch.outputs.name }}\` pushed, merge was clean." >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
