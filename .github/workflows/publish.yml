name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

on:
  workflow_dispatch:
  # Prospect: publish on each release (merge of develop into main). A schedule would run
  # from the default branch (develop), not from main.
  push:
    branches: [ main ]
  # Prospect: End

# Prospect: guard step permissions
permissions:
  actions: read
  contents: read
# Prospect: End

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # - name: Fail if we are attempting to run on the main branch # Prospect: Disable
      # if: ${{GITHUB.REF_NAME == 'main' && github.repository == 'Prospect-Sector/prospect-sector'}}
      # run: exit 1

    # Prospect: skip publish if main unchanged since last successful run
    - name: Skip if main has not changed since last successful publish
      id: guard
      if: github.event_name != 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        WF_NAME: ${{ github.workflow }}
        BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        echo "Repo: $REPO"
        echo "Workflow: $WF_NAME"
        echo "Branch: $BRANCH"

        # Current HEAD SHA of main
        current_sha="$(gh api "repos/${REPO}/commits/${BRANCH}" --jq .sha)"
        echo "Current main SHA: $current_sha"

        # Find head_sha of last successful run of this workflow on main (excluding current run)
        last_sha="$(
          gh api "repos/${REPO}/actions/runs?branch=${BRANCH}&status=success&per_page=100" \
          --arg WF_NAME "$WF_NAME" --arg CUR_RUN_ID "${{ github.run_id }}" \
          --jq '
            .workflow_runs
            | map(select(.name == $WF_NAME))
            | map(select((.id|tostring) != $CUR_RUN_ID))
            | sort_by(.id) | reverse
            | .[0].head_sha // empty
          '
        )"

        if [ -z "${last_sha:-}" ]; then
          echo "No previous successful run found; continuing."
          exit 0
        fi

        echo "Last successful run SHA: $last_sha"

        if [ "$current_sha" = "$last_sha" ]; then
          echo "No new commits on main since last successful publish; skipping."
          echo "skip=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "Main changed since last publish; continuing."
    # Prospect: End

    - name: Install dependencies
      if: steps.guard.outputs.skip != 'true' # Prospect
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - uses: actions/checkout@v7
      if: steps.guard.outputs.skip != 'true' # Prospect
      with:
        submodules: 'recursive'
        fetch-depth: 0
        filter: blob:none
    - name: Setup .NET Core
      if: steps.guard.outputs.skip != 'true' # Prospect
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      if: steps.guard.outputs.skip != 'true' # Prospect
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      if: steps.guard.outputs.skip != 'true' # Prospect
      run: dotnet restore

    # - name: Update changelog
    #   run: |
    #     dotnet tool install --global SpaceWizards.ChangelogTool --version 1.0.7
    #     ss14-changelog update -d Resources/Changelog
    #   env:
    #     REPO: ${{ github.repository }}
    #     BRANCH: stable
    #     CHANGELOG_REPO_PATH: Resources/Changelog
    #     EXTRA_CATEGORIES: Admin,Maps,Rules
    #     GITHUB_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}

    # - name: Commit and push changelog changes
    #   id: changelog
    #   run: |
    #     git config user.name "Space-Wizards-Bot"
    #     git config user.email "support@spacestation14.com"
    #     if [ -n "$(git status --porcelain Resources/Changelog)" ]; then
    #       git add Resources/Changelog
    #       git commit -m "Update changelog"
    #       git remote set-url origin "https://x-access-token:${CL_ACCESS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
    #       git push origin "HEAD:${GITHUB_REF_NAME}"
    #       echo "committed=true" >> "$GITHUB_OUTPUT"
    #     fi
    #   env:
    #     CL_ACCESS_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}

    # - name: Create PR from stable to master
    #   if: steps.changelog.outputs.committed == 'true'
    #   env:
    #     GH_TOKEN: ${{ secrets.CL_ACCESS_TOKEN }}
    #   run: |
    #     if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head stable --base master --state open --json number --jq '.[].number')" ]; then
    #       gh pr create --repo "$GITHUB_REPOSITORY" --base master --head stable --title "Update changelog" --body "Sync from release to master."
    #     fi

    - name: Build Packaging
      if: steps.guard.outputs.skip != 'true' # Prospect
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      if: steps.guard.outputs.skip != 'true' # Prospect
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

    - name: Package client
      if: steps.guard.outputs.skip != 'true' # Prospect
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      if: steps.guard.outputs.skip != 'true' # Prospect
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

    # - name: Publish changelog (Discord) # Prospect: Disable
      # run: Tools/actions_changelogs_since_last_run.py
      # env:
        # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}

    - name: Publish changelog (RSS)
      if: steps.guard.outputs.skip != 'true' # Prospect
      continue-on-error: true
      run: Tools/actions_changelog_rss.py
      env:
        CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}
